name: Sync from normal-character

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout your repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GHPAT }}
          path: target

      - name: Checkout source repo
        uses: actions/checkout@v4
        with:
          repository: Muoan/normal-character
          token: ${{ secrets.GHPAT }}
          path: source

      # 🟟 这是修改后的步骤，加入了安全检查
      - name: Copy files with safety check
        run: |
          # 1️⃣ 检查源仓库是否为空（排除 .git 目录）
          SOURCE_CONTENT=$(ls -A ../source --ignore=.git)
          if [ -z "$SOURCE_CONTENT" ]; then
            echo "⚠️  Source repository is empty or only has .git, skipping sync to avoid deleting your files."
            exit 0
          fi

          # 2️⃣ 源非空，执行同步
          cd target
          mkdir -p profile
          rm -rf profile/*
          cp -r ../source/* profile/ 2>/dev/null || true
          cp -r ../source/.[!.]* profile/ 2>/dev/null || true

      - name: Commit and push
        run: |
          cd target
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --staged --quiet || git commit -m "Sync from Muoan/normal-character $(date +'%Y-%m-%d')"
          git push
