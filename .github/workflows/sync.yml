name: Sync from normal-character

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout your repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GHPAT }}
          path: target

      - name: Checkout source repo
        uses: actions/checkout@v4
        with:
          repository: Muoan/normal-character
          token: ${{ secrets.GHPAT }}
          path: source

      - name: Copy files with safety check
        run: |
          if [ ! -d source ]; then
            echo "❌ Source directory 'source' not found, skipping sync."
            exit 1
          fi
          SOURCE_CONTENT=$(ls -A source --ignore=.git 2>/dev/null)
          if [ -z "$SOURCE_CONTENT" ]; then
            echo "⚠️  Source repository is empty or only has .git, skipping sync to avoid deleting your files."
            exit 0
          fi

          cd target
          mkdir -p profile
          rm -rf profile/*
          cp -r ../source/* profile/ 2>/dev/null || true
          cp -r ../source/.[!.]* profile/ 2>/dev/null || true

      - name: Commit and push
        run: |
          cd target
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --staged --quiet || git commit -m "Sync from Muoan/normal-character $(date +'%Y-%m-%d')"
          git push
